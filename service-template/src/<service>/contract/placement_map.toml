# The control-placement map — ADR-0017's security model as data (ticket #275).
#
# ADR-0017 is the SINGLE SOURCE. This file CITES it; it never restates a
# control's internals. It says where each control LIVES (its single owning
# home) and which threat frame(s) of ADR-0017 §1 it answers. The loader
# (`contract/placement.py`) validates the closed shape and the references;
# the invariant harness (`tests/support/placement.py`) proves the index is
# complete — every frame backed, every control homed, no control homed twice.
#
# NOT a declaration key: this is its own file, discovered next to the loader.
# A `[security]`/`[placement]` table in service.toml/implementation.toml is an
# unknown key there (ticket #75's ruling — the FILES are the declaration).
#
# The five threat frames of §1. A control's `backs` list is what makes the
# frame→control direction DERIVED (one source, two directions that cannot
# drift). `boundary = true` marks the frame §1 names an EXPLICIT BOUNDARY —
# a surface the model declares it does not fully defend (the honest
# non-overclaim; #282 lands the remaining non-goals, #284 the narrative).

[[frames]]
id = "compromised-agent-or-harness"
adr = "ADR-0017 §1.1 (compromised/malicious agent or harness — the primary defense target)"

[[frames]]
id = "accidental-data-leakage"
adr = "ADR-0017 §1.2 (accidental data leakage — a mis-configured connector or cloud implementation carrying data out)"

[[frames]]
id = "host-os-malware"
adr = "ADR-0017 §1.3 (malware on the user's host with OS-level access)"
boundary = true

[[frames]]
id = "trusted-lan-untrusted-internet"
adr = "ADR-0017 §1.4 (trusted LAN peers; untrusted everything crossing to the internet)"

[[frames]]
id = "host-os-files-unreachable"
adr = "ADR-0017 §1.5 (the platform must not reach into host OS files)"

# The controls ADR-0017 decides, each with exactly one home. Grouped by the
# ADR section that defines them; `§N` tokens in `adr` are what proves no
# control section of the ADR is silently unplaced.
#
# Deliberately NOT here: ADR-0017's Context — the trust-model basics it takes
# as given (machine identity keys, ADR-0003; the overlay, ADR-0003/0004; the
# keys/secrets split, ADR-0003/0006; per-agent registry scoping, ADR-0008 §5;
# the cloud action-context boundary, ADR-0004 §10). They are settled ground
# the ADR cross-references, not controls it decides — and none of the seven
# verification lanes (#277–#283) verifies them. §1's own frame parentheticals
# name registry scoping and the privacy labels; this map keeps a control to
# what ADR-0017 itself decides.

# --- §2 Isolation ---------------------------------------------------------

[[controls]]
id = "host-filesystem-isolation"
adr = "ADR-0017 §2; ADR-0014 (the mount mechanics; #14 sets the stance)"
home = "installer"
seam = "the WSL mount stance, checked at the installer runbook's checkpoints (#63)"
backs = ["host-os-files-unreachable", "compromised-agent-or-harness"]

[[controls]]
id = "os-container-isolation"
adr = "ADR-0017 §2 (OS-container isolation; a control the platform itself holds — §6 lists the filesystem boundary among the backstops around the harness)"
home = "chat-and-agents"
seam = "the session-container boundary (ADR-0007 §8; #48)"
backs = ["compromised-agent-or-harness"]

# --- §3 TLS stance --------------------------------------------------------

[[controls]]
id = "browser-facing-https"
adr = "ADR-0017 §3.1; ADR-0004 §9 (the local CA for the front door)"
home = "installer"
seam = "the local-CA HTTPS surfaces, front door and overlay (#63; ADR-0004 §9)"
backs = ["trusted-lan-untrusted-internet"]

[[controls]]
id = "machine-to-machine-http-bearer"
adr = "ADR-0017 §3.2 (trusted machine-to-machine API traffic on the trusted LAN; no mTLS, no full-internal-TLS)"
home = "installer"
seam = "the installer's front-door/overlay configuration (#63)"
backs = ["trusted-lan-untrusted-internet"]

# --- §4 Secrets at rest ---------------------------------------------------

[[controls]]
id = "secrets-at-rest-obfuscation"
adr = "ADR-0017 §4; ADR-0021 (the at-rest copies survive a leader rebuild), ADR-0006 §5 (the #19 rotation machinery is the actual control)"
home = "core"
seam = "the `keys` / `secrets` capabilities (ADR-0003; #62), leader and worker copies alike"
backs = ["host-os-malware"]

# --- §5 Container network policy -----------------------------------------

[[controls]]
id = "container-network-policy"
adr = "ADR-0017 §5 (the backstop for harness tool calls; the platform itself holds it — §6)"
home = "chat-and-agents"
seam = "the per-workspace-session container's network policy (#48)"
backs = ["compromised-agent-or-harness", "trusted-lan-untrusted-internet"]

# --- §7 Connectors audited door ------------------------------------------

[[controls]]
id = "connector-audit-logging"
adr = "ADR-0017 §7.1/§7.5; ADR-0030 (the per-tool tier)"
home = "connectors"
seam = "the door itself (`connectors.audit`, ADR-0030 §2.5; #50/#55); the trail view is the dashboard's (#64)"
backs = ["accidental-data-leakage", "compromised-agent-or-harness"]

[[controls]]
id = "connector-consequence-tier"
adr = "ADR-0017 §7.2 (per-tool per ADR-0030 §3.1 — declared explicitly, no default)"
home = "connectors"
seam = "the per-tool consequence tier on every connector tool (#50/#55; ADR-0030 §3.1)"
backs = ["accidental-data-leakage", "compromised-agent-or-harness"]

[[controls]]
id = "connector-caller-scoped-approval"
adr = "ADR-0017 §7.3; ADR-0030 §3.2 (per connector; caller-identity-scoped, never platform-wide)"
home = "connectors"
seam = "the approval grant riding the action-context, checked against the caller (#50/#55)"
backs = ["accidental-data-leakage", "compromised-agent-or-harness"]

[[controls]]
id = "harness-native-outside-the-door"
adr = "ADR-0017 §7.4"
home = "connectors"
seam = "the door's audit boundary — harness-native outbound is not funneled through the door (#50/#55)"
backs = ["compromised-agent-or-harness"]

# --- §8 Guardrails (data-safety) -----------------------------------------
# ADR-0017 §8's placement names the layer's sites — Inference's moderation
# model capability, Media transformations' builtin transforms, and the two
# boundary policy hooks (the agent loop's inbound hook, the outbound door
# hook). That is FOUR controls, EACH with its own single home — never one
# control with two homes. The Inference model capability is the cheap
# classification surface the two boundaries call (ADR-0029's classic-AI
# capability); the door-side and loop-side hooks are where §8's two boundary
# policies live. (The `guardrail-*` ids below are what the harness's §8 site
# invariant groups by home.)

[[controls]]
id = "guardrail-classification"
adr = "ADR-0017 §8; ADR-0029 (Inference's classic-AI model capability)"
home = "inference"
seam = "Inference's classic-AI model capability (ADR-0029 §2 — `ml.model`; #47)"
backs = ["accidental-data-leakage", "compromised-agent-or-harness"]

[[controls]]
id = "guardrail-media-transforms"
adr = "ADR-0017 §8 (builtin transforms — Media transformations)"
home = "media-transformations"
seam = "the builtin transforms (see `docs/architecture/30-services/43`; #58)"
backs = ["accidental-data-leakage"]

[[controls]]
id = "guardrail-outbound-door-hook"
adr = "ADR-0017 §8 (the outbound boundary; ADR-0030 places Connectors' `connectors.guardrails` management capability)"
home = "connectors"
seam = "the outbound door hook at the Connectors boundary (#50/#55)"
backs = ["accidental-data-leakage"]

[[controls]]
id = "guardrail-inbound-loop-hook"
adr = "ADR-0017 §8 (the inbound boundary; the agent service loop)"
home = "chat-and-agents"
seam = "the policy hook in the agent loop (#48)"
backs = ["compromised-agent-or-harness"]

