[project]
name = "wordslab-template-service"
version = "0.1.0"
description = "Service template — copy-to-start (ADR-0002). Rename this package when copying."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0",
    "python-fasthtml>=0.14.13",
    "starlette>=0.41",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `_service_` is the placeholder package directory (Windows-safe: <> are illegal in Windows filenames); the copy-to-start ritual
# renames it (service-template/CONTRIBUTING.md).
packages = ["src/_service_"]

[tool.pytest.ini_options]
testpaths = ["tests"]
