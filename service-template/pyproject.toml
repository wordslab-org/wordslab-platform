[project]
name = "wordslab-template-service"
version = "0.1.0"
description = "Service template — copy-to-start (ADR-0002). Rename this package when copying."
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.41",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `<service>` is the placeholder package directory; the copy-to-start ritual
# renames it (service-template/CONTRIBUTING.md).
packages = ["src/<service>"]

[tool.pytest.ini_options]
testpaths = ["tests"]
