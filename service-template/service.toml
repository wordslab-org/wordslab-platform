# The service declaration (ADR-0002 §5, shape v3 per ADR-0031 §2).
# The copy-to-start ritual edits this file (service-template/CONTRIBUTING.md
# step 3).
#
# A service is a set of capabilities. Layout: the service's own properties
# first, then one documentation section per capability, named
# [<service-name>.<capability-name>]. This file is DATA read at
# startup/install/catalog-build (ticket #74's `load_service_toml`).
# API families are NOT declared — the capabilities' APIs implement
# ADR-0001's family contracts; their documentation is enough. No
# capability-level dependencies — implementations declare their
# dependencies.
name = "template-service"
description = "The service template — copy-to-start skeleton."
version = "0.1.0"

[requirements]
# The service's own API + UI code execution only — each capability
# implementation selected at install time adds its own requirements
# (the implementation template's parts and own requirements).
disk-gb = 0.01
ram-gb = 0.05

# The per-capability documentation sections. The canary is the template's
# proof capability (ticket #71) — a real service replaces it with its own.
#
# The learning/operability bar is NOT declared here (ticket #75; ADR-0024
# §1, ADR-0002 §7; shape per ADR-0031 §2 as amended): it is DISCOVERED BY
# LAYOUT at load, and every artifact found is audited. The conventions:
#
#   docs/service/<level>.md              the service's own docs — the
#                                        capabilities overview + the UI doc
#   docs/capabilities/<cap>/<level>.md   the capability's docs — the detail
#                                        of its API + UI
#   skills/service/<slug>/SKILL.md       the service-level skill
#   skills/capabilities/<cap>/<slug>/SKILL.md
#
# <level> is one of the four graded depths: how-to-use · how-it-works ·
# study-in-depth · going-further. The FILENAME is the level; the skill's
# DIRECTORY NAME is the registry slug (the authored entry is
# <service>.skill.<slug>, ADR-0008) and its front-matter carries the
# one-line description the registry loads it by.
#
# A MISSING SKILL MEANS SOMETHING DIFFERENT AT EACH LEVEL:
#   - capability, no skill → genuinely not agent-operable (no deterministic
#     surface to drive it);
#   - service, no skill → no skill above the capabilities; the service stays
#     agent-operable if any capability is (this level covers only what no
#     single capability does);
#   - implementation, no skill → nothing specific in addition to the
#     capability's skill — nothing is missing.
#
# Mandatory to publish for bundled/listed, recommended-with-tracked-gaps for
# third-party (ADR-0018); a missing artifact is a gap, not a boot error.

[template-service.canary]
description = "The template's proof capability — echo, wired to all three callable surfaces, carrying the consent-flag contract (ticket #72)."
version = "0.2.0"
api = "/v1/echo"
api-functions = "POST /v1/echo — returns the request body; the body carries the consent flag (ADR-0026 §1: 'may_use' default / 'private_secret'); GET /v1/echo/extract — the recorded interactions through the consent gate (the private/secret exclusion is never bypassable), item-5 paginated with the exclusion report riding every page; GET /v1/echo/ping — returns pong."
versions-history = "0.1.0 — initial canary (ticket #71). 0.2.0 — consent flag + never-bypassable extraction gate (ticket #72)."
required = false

[template-service.canary.ui]
description = "A single Echo page echoing text input, with the visible 'private/secret — do not use' consent toggle (FastHTML + Alpine, vendored assets)."
versions-history = "0.1.0 — initial Echo page. 0.2.0 — the consent toggle on the input form (ticket #72)."
menu = [
  { label = "Echo", entry = "/echo" },
]

# The control-placement capability (ticket #275) — the template-level
# contract-checker that indexes ADR-0017's security model and asserts the
# placement invariants. Its surface is DATA, not HTTP: the placement map is
# the data, `load_placement_map` the seam, and `sweep_placement` the
# sweeper-consumable entry point. It mounts no route and contributes NO
# fragment to the service's OpenAPI document, so there is no capability path
# to name — `api` names the service's own API description document
# (`/openapi.json`, the base route the shell serves), which is where
# capabilities are described and discovered (ADR-0031 §2: `api` is the
# capability's API description entry point). A `/v1/...` path here would
# promise a routable capability that never appears in the document. It is
# driven in-process (see its drive-placement skill), never over `/v1`.
[template-service.placement]
description = "The control-placement map + the placement-invariant harness (ticket #275): every threat frame in ADR-0017 §1 resolves to ≥1 named control, every control resolves to exactly one owning home (no control homeless, no control duplicated), asserted deterministically and re-runnable by the sweeper. A DATA surface — it mounts no route; its map is the data and `sweep_placement` the entry point."
version = "0.1.0"
api = "/openapi.json"
api-functions = "A data surface, not an HTTP surface (it contributes no OpenAPI fragment): load_placement_map() returns the parsed, validated map (every threat frame → the controls backing it → each control's single home); the invariant harness (sweep_placement) stands up a stub owning-capability surface per home and reports placement findings. The map is data with a closed shape — it is NOT a declaration key, and it cites ADR-0017 rather than restating a control's internals (#66's no-double-testing rule)."
versions-history = "0.1.0 — the map + the harness (ticket #275)."
required = false

[template-service.placement.ui]
description = "No UI: the checker is consumed by the test-harness sweeper (#68/#85) and by the security verification lanes (#276–#283), never by the dashboard."
versions-history = "0.1.0 — no UI surface (ticket #275)."
menu = []


